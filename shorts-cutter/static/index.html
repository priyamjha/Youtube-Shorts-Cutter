<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Cutter</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2230; --border: #2a2f3d;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #ff3d5a; --accent2: #ff7a8a;
    --ok: #3ddc84; --warn: #ffb648; --err: #ff5c5c; --info: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  a { color: var(--info); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.2px; }
  header h1 span { color: var(--accent); }
  .sys { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=number], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; outline: none; }
  input[type=text]:focus, input[type=number]:focus, select:focus { border-color: var(--accent); }
  input.url { flex: 1; min-width: 260px; font-size: 15px; }
  input[type=number] { width: 84px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
           padding: 9px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #3d4458; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent2); }
  button.small { padding: 5px 10px; font-size: 12px; }
  button.danger { color: var(--err); }
  label.opt { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
  .settings { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .jobs { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .job { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .job-top { display: flex; gap: 14px; padding: 14px; }
  .thumb { width: 160px; height: 90px; border-radius: 8px; background: var(--panel2); object-fit: cover; flex-shrink: 0; }
  .job-info { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 15px; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .b-run { background: #1d3557; color: var(--info); }
  .b-ok { background: #15392a; color: var(--ok); }
  .b-err { background: #3d1c1c; color: var(--err); }
  .b-warn { background: #3d2f14; color: var(--warn); }
  .b-muted { background: var(--panel2); color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }

  .steps { display: flex; gap: 4px; padding: 0 14px 10px; flex-wrap: wrap; }
  .step { font-size: 11px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--panel2); }
  .step.done { color: var(--ok); }
  .step.active { color: #fff; background: #2c3550; }
  .step.skip { opacity: .4; text-decoration: line-through; }

  .prog { padding: 0 14px 12px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  .bar.green > div { background: linear-gradient(90deg, #22b36b, var(--ok)); }
  .prog-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; flex-wrap: wrap; gap: 8px; }
  .prog-meta b { color: var(--text); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; padding: 0 14px 12px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--muted); }

  .export { margin: 0 14px 12px; padding: 12px; background: var(--panel2); border-radius: 10px; }
  .export .row { gap: 8px; }
  .export .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .msg { padding: 0 14px 12px; color: var(--muted); font-size: 13px; }
  .msg.err { color: var(--err); white-space: pre-wrap; }

  .toggles { display: flex; gap: 10px; padding: 0 14px 12px; }
  .toggles button { background: none; border: none; color: var(--info); padding: 0; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-top: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.exp td:first-child { color: var(--ok); }
  .tbl { max-height: 420px; overflow: auto; border-top: 1px solid var(--border); }
  .log { background: #0b0d12; border-top: 1px solid var(--border); padding: 10px 14px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); max-height: 220px; overflow: auto; white-space: pre-wrap; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .modal video { max-height: 85vh; max-width: 90vw; border-radius: 10px; background: #000; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2a1a1f; color: #fff;
           border: 1px solid var(--err); border-radius: 10px; padding: 10px 16px; display: none; z-index: 20; max-width: 90vw; }
  .toast.show { display: block; }
  .live { color: var(--err); font-weight: 600; }
  @media (max-width: 600px) { .thumb { width: 110px; height: 62px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Shorts <span>Cutter</span></h1>
    <div class="sys" id="sys">loading…</div>
  </header>

  <div class="panel">
    <div class="row">
      <input class="url" id="url" type="text" placeholder="Paste a YouTube link (video, Short, or past livestream) and press Enter" autofocus>
      <button class="primary" id="go">Analyze</button>
      <button id="toggleSettings">Settings</button>
    </div>
    <div class="settings" id="settings" style="display:none">
      <div class="row" style="gap:16px">
        <label class="opt">Max length (s)<input type="number" id="max_len" min="5" max="180"></label>
        <label class="opt">Min length (s)<input type="number" id="min_len" min="3" max="179"></label>
        <label class="opt">Silence threshold (dB)<input type="number" id="noise_db" min="-60" max="-10"></label>
        <label class="opt">Download quality
          <select id="quality"><option value="1080">1080p (best)</option><option value="720">720p (faster)</option></select></label>
        <label class="opt">Output format
          <select id="format">
            <option value="blur">Vertical 9:16, blurred background (Shorts)</option>
            <option value="crop">Vertical 9:16, center crop</option>
            <option value="original">Original (landscape)</option>
          </select></label>
        <label class="chk" style="margin-top:14px"><input type="checkbox" id="scenes"> Scene detection (better cuts, slower on long videos)</label>
      </div>
      <div class="hint">Cuts prefer a pause in speech, then a scene change, then a hard cut at the max length. YouTube Shorts allow up to 180 s; vertical format is required for a video to count as a Short.</div>
    </div>
  </div>

  <div class="jobs" id="jobs"><div class="empty">No videos yet. Paste a link above.</div></div>
</div>

<div class="modal" id="modal" onclick="closeModal()"><video id="player" controls autoplay></video></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const ui = {};            // per-job UI state: {from, to, overwrite, table, log}
let lastRender = {};      // job id -> JSON string, to skip unchanged re-renders
let defaults = null;

function toast(msg, ms = 5000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(s) {
  if (s == null || isNaN(s)) return '–';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
const fmtMB = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB';

// ---------- settings ----------
function readSettings() {
  return {
    max_len: +$('#max_len').value, min_len: +$('#min_len').value, noise_db: +$('#noise_db').value,
    quality: +$('#quality').value, format: $('#format').value, scenes: $('#scenes').checked,
  };
}
function applySettings(s) {
  $('#max_len').value = s.max_len; $('#min_len').value = s.min_len; $('#noise_db').value = s.noise_db;
  $('#quality').value = s.quality; $('#format').value = s.format; $('#scenes').checked = s.scenes;
}
function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(readSettings())); } catch {} }
$('#settings').addEventListener('change', saveSettings);
$('#toggleSettings').onclick = () => { const s = $('#settings'); s.style.display = s.style.display === 'none' ? '' : 'none'; };

// ---------- create job ----------
async function submit() {
  const url = $('#url').value.trim();
  if (!url) return;
  $('#go').disabled = true;
  try {
    await api('/api/jobs', { method: 'POST', body: JSON.stringify({ url, settings: readSettings() }) });
    $('#url').value = '';
    await refresh();
  } catch (e) { toast(e.message); }
  $('#go').disabled = false;
}
$('#go').onclick = submit;
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

// ---------- actions ----------
async function act(id, action, body) {
  try {
    await api(`/api/jobs/${id}/${action}`, { method: 'POST', body: JSON.stringify(body || {}) });
    await refresh(true);
  } catch (e) { toast(e.message); }
}
async function del(id, files) {
  const j = jobsById[id];
  const what = files ? 'this video AND delete its downloaded file and exported shorts' : 'this video from the list (files are kept)';
  if (!confirm(`Remove ${what}?\n\n${j?.video?.title || j.url}`)) return;
  try { await api(`/api/jobs/${id}?files=${files ? 1 : 0}`, { method: 'DELETE' }); delete ui[id]; await refresh(true); }
  catch (e) { toast(e.message); }
}
function exportRange(id, all) {
  const u = ui[id] || {};
  const body = all ? { all: true } : { from: +u.from || 1, to: +u.to || 1 };
  body.overwrite = !!u.overwrite;
  act(id, 'export', body);
}
function exportNext(id, count) {
  const j = jobsById[id];
  const next = j.segments.map(s => s.n).find(n => !j.exported.includes(n));
  if (!next) return toast('Everything is already exported.');
  ui[id] = ui[id] || {}; ui[id].from = next; ui[id].to = Math.min(next + count - 1, j.segments.length);
  exportRange(id, false);
}
function setUi(id, key, val) { ui[id] = ui[id] || {}; ui[id][key] = val; }
function toggle(id, key) { setUi(id, key, !(ui[id] || {})[key]); lastRender[id] = ''; render(); }
function play(id, n) { $('#player').src = `/api/jobs/${id}/clip/${n}`; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); $('#player').pause(); $('#player').src = ''; }

// ---------- render ----------
let jobsById = {};
const STEPS = ['Info', 'Download', 'Pauses', 'Scenes', 'Plan', 'Export'];
const STEP_OF = { queued: 0, fetching: 0, downloading: 1, silence: 2, scenes: 3, planning: 4, ready: 5, exporting: 5, done: 6 };

function badge(j) {
  const s = j.status;
  if (['queued','fetching','downloading','silence','scenes','planning'].includes(s)) return `<span class="badge b-run">Analyzing</span>`;
  if (s === 'exporting') return `<span class="badge b-run">Exporting</span>`;
  if (s === 'ready') return `<span class="badge b-ok">Ready</span>`;
  if (s === 'done') return `<span class="badge b-ok">All exported</span>`;
  if (s === 'error') return `<span class="badge b-err">Error</span>`;
  if (s === 'cancelled') return `<span class="badge b-warn">Cancelled</span>`;
  return `<span class="badge b-muted">${esc(s)}</span>`;
}

function jobHtml(j) {
  const u = ui[j.id] = ui[j.id] || { from: 1, to: 10 };
  const running = ['queued','fetching','downloading','silence','scenes','planning','exporting'].includes(j.status);
  const v = j.video || {};
  const nSeg = j.segments.length, nExp = j.exported.length, nLeft = nSeg - nExp;
  const stepIdx = STEP_OF[j.status] ?? -1;
  const steps = STEPS.map((name, i) => {
    let cls = 'step';
    if (name === 'Scenes' && !j.settings.scenes) cls += ' skip';
    else if (i < stepIdx || j.status === 'done') cls += ' done';
    else if (i === stepIdx && running) cls += ' active';
    return `<span class="${cls}">${i < stepIdx || j.status === 'done' ? '✓ ' : ''}${name}</span>`;
  }).join('');

  const elapsedStart = j.export?.started;
  let prog = '';
  if (running) {
    const pct = Math.round((j.progress || 0) * 100);
    prog = `<div class="prog"><div class="bar ${j.status === 'exporting' ? 'green' : ''}"><div style="width:${pct}%"></div></div>
      <div class="prog-meta">
        <span><b>${esc(j.phase)}</b> ${j.detail ? '· ' + esc(j.detail) : ''}</span>
        <span><b>${pct}%</b> · time left: <b>${j.eta != null ? fmtTime(j.eta) : 'estimating…'}</b>${elapsedStart ? ' · elapsed ' + fmtTime(Date.now()/1000 - elapsedStart) : ''}</span>
      </div></div>`;
  }

  let stats = '';
  if (nSeg) {
    const a = j.analysis || {};
    stats = `<div class="stats">
      <div class="stat"><div class="v">${nSeg}</div><div class="k">shorts planned</div></div>
      <div class="stat"><div class="v" style="color:var(--ok)">${nExp}</div><div class="k">exported</div></div>
      <div class="stat"><div class="v">${nLeft}</div><div class="k">remaining</div></div>
      <div class="stat"><div class="v">${j.settings.max_len}s</div><div class="k">max length</div></div>
      <div class="stat"><div class="v">${a.silences ?? 0}</div><div class="k">pauses found</div></div>
      <div class="stat"><div class="v">${j.settings.scenes ? (a.scenes ?? 0) : '–'}</div><div class="k">scene changes</div></div>
    </div>`;
  }

  let exp = '';
  if (nSeg && !running) {
    exp = `<div class="export">
      <div class="row">
        <button class="primary" onclick="exportRange('${j.id}', true)" ${nLeft === 0 && !u.overwrite ? 'disabled' : ''}>Export all ${nLeft ? `(${nLeft} left)` : ''}</button>
        <span style="color:var(--muted)">or range</span>
        <input type="number" min="1" max="${nSeg}" value="${u.from}" oninput="setUi('${j.id}','from',this.value)"> <span style="color:var(--muted)">to</span>
        <input type="number" min="1" max="${nSeg}" value="${u.to}" oninput="setUi('${j.id}','to',this.value)">
        <button onclick="exportRange('${j.id}', false)">Export range</button>
        <label class="chk"><input type="checkbox" ${u.overwrite ? 'checked' : ''} onchange="setUi('${j.id}','overwrite',this.checked)"> overwrite existing</label>
      </div>
      <div class="chips">
        <span style="color:var(--muted);font-size:12px;align-self:center">Quick:</span>
        <button class="small" onclick="exportNext('${j.id}', 5)">Next 5</button>
        <button class="small" onclick="exportNext('${j.id}', 10)">Next 10</button>
        <button class="small" onclick="exportNext('${j.id}', 25)">Next 25</button>
        <span style="color:var(--muted);font-size:12px;align-self:center">Saved to: ${esc(j.out_dir || '')}</span>
      </div>
    </div>`;
  }

  const msg = j.error ? `<div class="msg err">${esc(j.error)}</div>` : (j.message && !running ? `<div class="msg">${esc(j.message)}</div>` : '');

  let table = '';
  if (u.table && nSeg) {
    table = `<div class="tbl"><table><tr><th>#</th><th>From → To</th><th>Length</th><th>Cut at</th><th>Status</th><th></th></tr>` +
      j.segments.map(s => {
        const done = j.exported.includes(s.n);
        const size = j.sizes?.[s.n];
        return `<tr class="${done ? 'exp' : ''}"><td>${done ? '✓ ' : ''}${s.n}</td><td>${fmtTime(s.start)} → ${fmtTime(s.end)}</td><td>${s.dur.toFixed(1)}s</td>
          <td>${esc(s.reason)}</td><td>${done ? 'exported · ' + fmtMB(size) : (j.export?.current === s.n ? 'exporting…' : 'pending')}</td>
          <td>${done ? `<button class="small" onclick="play('${j.id}',${s.n})">▶ Play</button>` : ''}</td></tr>`;
      }).join('') + `</table></div>`;
  }
  const log = u.log ? `<div class="log">${esc(j.log.join('\n'))}</div>` : '';

  const actions = [];
  if (running) actions.push(`<button class="small danger" onclick="act('${j.id}','cancel')">Cancel</button>`);
  if (['error','cancelled'].includes(j.status)) actions.push(`<button class="small" onclick="act('${j.id}','retry')">Retry</button>`);
  if (j.out_dir) actions.push(`<button class="small" onclick="act('${j.id}','open')">Open folder</button>`);
  if (!running) actions.push(`<button class="small" onclick="del('${j.id}', false)">Remove</button>
                             <button class="small danger" onclick="del('${j.id}', true)">Delete + files</button>`);

  const liveTag = v.is_live ? ' <span class="live">● LIVE</span>' : (v.live_status === 'was_live' ? ' <span class="sub">(past livestream)</span>' : '');
  return `<div class="job-top">
      ${v.thumbnail ? `<img class="thumb" src="${esc(v.thumbnail)}" alt="">` : '<div class="thumb"></div>'}
      <div class="job-info">
        <p class="title" title="${esc(v.title || j.url)}">${esc(v.title || j.url)}${liveTag}</p>
        <div class="sub">${esc(v.channel || '')}${v.duration ? ' · ' + fmtTime(v.duration) : ''}${j.file ? ' · ' + fmtMB(j.file.size) + ' downloaded' : ''} · <a href="${esc(v.webpage_url || j.url)}" target="_blank">open on YouTube</a></div>
        <div style="margin-top:6px">${badge(j)} <span class="sub">${esc(j.settings.format === 'original' ? 'landscape' : '9:16 ' + j.settings.format)} · ${j.settings.min_len}–${j.settings.max_len}s · ${j.settings.quality}p</span></div>
      </div>
      <div class="actions">${actions.join('')}</div>
    </div>
    <div class="steps">${steps}</div>
    ${prog}${stats}${exp}${msg}
    <div class="toggles">
      ${nSeg ? `<button onclick="toggle('${j.id}','table')">${u.table ? 'Hide' : 'Show'} all ${nSeg} shorts</button>` : ''}
      <button onclick="toggle('${j.id}','log')">${u.log ? 'Hide' : 'Show'} log</button>
    </div>${table}${log}`;
}

function render() {
  const list = Object.values(jobsById).sort((a, b) => b.created - a.created);
  const box = $('#jobs');
  if (!list.length) { box.innerHTML = '<div class="empty">No videos yet. Paste a link above.</div>'; lastRender = {}; return; }
  if (box.querySelector('.empty')) box.innerHTML = '';
  const seen = new Set();
  list.forEach(j => {
    seen.add(j.id);
    let el = document.getElementById('job-' + j.id);
    if (!el) { el = document.createElement('div'); el.className = 'job'; el.id = 'job-' + j.id; box.prepend(el); }
    const key = JSON.stringify([j, ui[j.id]?.table, ui[j.id]?.log, ui[j.id]?.overwrite, Math.floor(Date.now() / 1000)]);
    if (lastRender[j.id] === key) return;
    // don't clobber a range the user is typing into
    const active = document.activeElement;
    if (active && el.contains(active) && active.tagName === 'INPUT') return;
    lastRender[j.id] = key;
    el.innerHTML = jobHtml(j);
  });
  [...box.children].forEach(el => { if (!seen.has(el.id.replace('job-', ''))) el.remove(); });
}

async function refresh(force) {
  try {
    const list = await api('/api/jobs');
    jobsById = Object.fromEntries(list.map(j => [j.id, j]));
    render();
  } catch (e) { if (force) toast(e.message); }
}

async function init() {
  try {
    const s = await api('/api/status');
    defaults = s.defaults;
    let saved = null; try { saved = JSON.parse(localStorage.getItem('settings')); } catch {}
    applySettings({ ...defaults, ...(saved || {}) });
    $('#sys').innerHTML = `${s.tools.ffmpeg ? '✓ FFmpeg' : '<span style="color:var(--err)">✗ FFmpeg missing — brew install ffmpeg</span>'}
      · encoder: ${esc(s.tools.encoder || '–')} · ${s.free_gb} GB free
      · <button class="small" onclick="api('/api/open-output',{method:'POST'})">📁 Open shorts folder</button>`;
  } catch (e) { toast('Cannot reach the server: ' + e.message); }
  await refresh(true);
  setInterval(refresh, 1000);
}
init();
</script>
</body>
</html>
